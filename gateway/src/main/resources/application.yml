server:
  address: 127.0.0.1
  port: 8080

spring:
  application:
    name: demo-gateway
  main:
    banner-mode: "off"
  cloud:
    discovery:
      client:
        simple:
          instances:
            demo-service:
              - instance-id: instance-1
                uri: http://127.0.0.1:8081
              - instance-id: instance-2
                uri: http://127.0.0.1:8082
              - instance-id: instance-3
                uri: http://127.0.0.1:8083
    gateway:
      server:
        webflux:
          routes:
            - id: demo-service
              uri: lb://demo-service
              predicates:
                - Path=/api/**
          httpclient:
            connect-timeout: 1000
            response-timeout: 3s
    loadbalancer:
      eager-load:
        clients:
          - demo-service
      cache:
        enabled: false
      retry:
        enabled: false
      health-check:
        initial-delay: 0s
        interval: 2s
        path:
          default: /api/actuator/health
        update-results-list: false

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health,info

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{30} - %msg%n"
